<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPHD Vertical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

body {
  background: #1a0a05;
  background-image:
    radial-gradient(ellipse at 25% 12%, rgba(255,180,120,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 45%, rgba(200,140,80,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 85%, rgba(255,160,110,0.05) 0%, transparent 55%);
  font-family: 'Playfair Display', Georgia, serif;
  color: #fff;
  overflow-x: hidden;
}

/* ── Fixed atmosphere layers ── */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }

.cloud {
  position: absolute; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(255,245,238,0.13) 0%, transparent 70%);
  filter: blur(28px);
  will-change: transform;
}
.leaf {
  position: absolute; top: 0; left: 0;
  border-radius: 0 50% 50% 50%;
  will-change: transform, opacity;
}
.leaf i {
  position: absolute; inset: 0;
  border-radius: inherit;
  display: block;
}

.vignette {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 58%, rgba(10,4,2,0.55) 100%);
}

/* Whole scene slides as one pre-rasterized composited layer —
   prevents tile re-raster ghosting during motion */
#scroller { will-change: transform; transform: translate3d(0, 0, 0); }

/* ── Hero ── */
.hero {
  height: 1280px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  position: relative; z-index: 1;
  padding: 0 48px;
}
.hero .rule {
  width: 90px; height: 1px;
  margin: 34px auto 0;
  background: linear-gradient(90deg, transparent, rgba(201,169,110,0.9), transparent);
}
.hero h1 {
  font-size: 84px; line-height: 1.14; font-weight: 700;
  background: linear-gradient(135deg, #e05a47 0%, #7fb3d9 55%, #c0392b 100%);
  background-size: 220% 220%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero h2 {
  margin-top: 26px;
  font-size: 44px; font-weight: 600;
  color: #c9a96e; letter-spacing: 0.22em;
}
.hero .date {
  margin-top: 30px;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 26px; letter-spacing: 0.35em;
  color: rgba(255,235,215,0.75);
}
.hero .years {
  margin-top: 14px;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
  font-size: 24px;
  color: rgba(255,215,190,0.6);
}

/* ── Polaroid flow ── */
.wall {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 90px;
  padding: 120px 0 260px;
}
.card {
  width: 470px;
  background: linear-gradient(175deg, #fdfaf5 0%, #f6efe6 100%);
  padding: 16px 16px 18px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.35);
  will-change: transform;
}
.card:nth-child(odd)  { align-self: flex-start; margin-left: 46px; }
.card:nth-child(even) { align-self: flex-end; margin-right: 46px; }
.card img {
  display: block; width: 100%; aspect-ratio: 1 / 1;
  object-fit: cover;
  filter: saturate(1.04) contrast(1.02);
}

.end-space {
  height: 1280px;
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
}
.end-glow {
  width: 130px; height: 130px; border-radius: 50%;
  background: radial-gradient(circle at center, rgba(255,190,140,0.35) 0%, rgba(192,57,43,0.15) 45%, transparent 70%);
  will-change: transform, opacity;
}
#endclip {
  width: 680px;
  border-radius: 10px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.65), 0 6px 18px rgba(0,0,0,0.4);
  will-change: opacity;
  opacity: 0;
}
</style>
</head>
<body>
<div id="scroller">
<div class="hero">
  <h1 id="shimmer">Happy Anniversary<br>Mom &amp; Dad</h1>
  <div class="rule"></div>
  <h2>August 21, 2026</h2>
  <div class="date">EIGHTEEN YEARS</div>
  <div class="years">2008 &mdash; 2026</div>
</div>

<div class="wall" id="wall"></div>

<div class="end-space"><img id="endclip" alt="" draggable="false"><div class="end-glow" id="glow"></div></div>
</div>

<div class="fx" id="fx"></div>
<div class="vignette"></div>

<script>
// ── Timeline constants (must match renderer) ──
const HOLD  = 5500;   // ms held on hero before scrolling
const TOTAL = 43000;  // total scene duration in ms
const FPS   = 30;

const PHOTOS = [
  "FB_IMG_1471918819858.jpg","IMG_0376.JPG","IMG_0495.JPG","IMG_0586.JPG",
  "IMG_1349.JPG","IMG_1982.JPG","IMG_2116.JPG","IMG_2831.JPG",
  "IMG_3044.JPG","IMG_3265.JPG","IMG_3475.jpg","IMG_4141.jpg",
  "IMG_4966.jpg","IMG_5279.jpg","IMG_7069.JPG","IMG_7151.JPG",
  "IMG-20240513-WA0001.jpg","IMG20210821214126.jpg"
];

const VW = 720, VH = 1280;

// ── Build polaroids ──
const cardEls = [];
(function() {
  const wall = document.getElementById('wall');
  PHOTOS.forEach(function(name, i) {
    const card = document.createElement('div');
    card.className = 'card';
    const r = (i % 2 === 0 ? -1 : 1) * (1.2 + (i % 3) * 0.7);
    cardEls.push({
      el: card,
      r: r,
      dur: 6.5 + (i % 4) * 0.8,          // seconds per sway cycle
      phase: i * 0.9,                    // seconds offset
    });
    const img = document.createElement('img');
    img.src = '../public/photos/' + encodeURIComponent(name);
    img.alt = '';
    img.draggable = false;
    card.appendChild(img);
    wall.appendChild(card);
  });
})();

// ── Build clouds ──
const cloudEls = [];
(function() {
  const fx = document.getElementById('fx');
  for (let i = 0; i < 9; i++) {
    const el = document.createElement('div');
    el.className = 'cloud';
    const w = 220 + (i % 3) * 130;
    Object.assign(el.style, {
      top: (3 + i * 11) + '%',
      width: w + 'px',
      height: (w * 0.34) + 'px',
      opacity: String(0.05 + (i % 3) * 0.025),
    });
    fx.appendChild(el);
    cloudEls.push({ el: el, w: w, dur: 30 + (i % 3) * 14, delay: i * 4 });
  }
})();

// ── Build leaves ──
const leafEls = [];
(function() {
  const fx = document.getElementById('fx');
  const hues = [35, 28, 42, 20];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div');
    el.className = 'leaf';
    const size = 13 + (i % 4) * 6;
    const inner = document.createElement('i');
    inner.style.background = 'hsl(' + hues[i % 4] + ',52%,52%)';
    el.appendChild(inner);
    Object.assign(el.style, {
      width: size + 'px',
      height: Math.round(size * 1.3) + 'px',
    });
    fx.appendChild(el);
    leafEls.push({
      el: el,
      x0: ((i * 3.9 + 1.4) % 96) / 100 * VW,     // base x px
      o: 0.28 + (i % 4) * 0.09,                 // base opacity
      dur: 7 + (i % 5) * 1.6,                   // seconds per fall
      delay: (i * 1.63) % 9,                    // seconds offset
      wob: (i % 3) + 1,                         // horizontal wobble freq
      ph: i * 1.1,
    });
  }
})();

const glowEl = document.getElementById('glow');
const shimmerEl = document.getElementById('shimmer');
const scrollerEl = document.getElementById('scroller');
const endclipEl = document.getElementById('endclip');

// ── Ending clip: first 6s of the user's video as deterministic frames ──
const CLIP_FRAMES = [];
for (let i = 1; i <= 180; i++) {
  CLIP_FRAMES.push(new Image());
  CLIP_FRAMES[i - 1].src = 'clip/c_' + String(i).padStart(4, '0') + '.jpg';
}
const CLIP_START = TOTAL - 6000; // clip occupies the final 6 seconds

let maxScroll = 0;
function computeLayout() {
  maxScroll = document.documentElement.scrollHeight - VH;
}

// ── Deterministic clock: renderer calls this once per frame ──
window.__setTime = function(tms) {
  const t = tms / 1000;

  // Scroll — composited transform instead of window.scrollTo.
  // Gliding finishes at CLIP_START so the ending clip holds steady for 6s.
  if (tms > HOLD) {
    const p = Math.min(1, (tms - HOLD) / (CLIP_START - HOLD));
    const e = p * p * (3 - 2 * p);
    const y = e * maxScroll;
    scrollerEl.style.transform = 'translate3d(0,' + (-y).toFixed(2) + 'px,0)';
  }

  // Ending clip
  if (tms >= CLIP_START - 500) {
    const idx = Math.min(179, Math.max(0, Math.floor((tms - CLIP_START) / 1000 * 30)));
    endclipEl.src = CLIP_FRAMES[idx].src;
    endclipEl.style.opacity = tms >= CLIP_START ? '1' : '0';
    glowEl.style.opacity = tms >= CLIP_START ? '0' : String(glowEl.style.opacity || 0.85);
    glowEl.style.display = tms >= CLIP_START ? 'none' : 'block';
  }

  // Hero shimmer
  const sh = 50 - 50 * Math.cos(2 * Math.PI * t / 5);
  shimmerEl.style.backgroundPosition = sh.toFixed(2) + '% 50%';

  // Clouds
  for (let i = 0; i < cloudEls.length; i++) {
    const c = cloudEls[i];
    const pr = (((t + c.delay) % c.dur) / c.dur);
    const x = -0.5 * c.w + pr * (VW + c.w);
    c.el.style.transform = 'translateX(' + x.toFixed(1) + 'px)';
  }

  // Leaves
  for (let i = 0; i < leafEls.length; i++) {
    const L = leafEls[i];
    const pr = (((t + L.delay) % L.dur) / L.dur);
    const y = -40 + pr * (VH + 90);
    const x = L.x0 + 70 * pr + Math.sin(pr * Math.PI * 2 * L.wob + L.ph) * 30;
    const rot = 45 + 400 * pr;
    const fade = Math.min(1, pr * 10) * Math.min(1, (1 - pr) * 9);
    L.el.style.transform =
      'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' + rot.toFixed(1) + 'deg)';
    L.el.style.opacity = (L.o * fade).toFixed(3);
  }

  // Polaroid sway
  for (let i = 0; i < cardEls.length; i++) {
    const c = cardEls[i];
    const a = 2 * Math.PI * (t / c.dur) + c.phase;
    const ang = c.r * Math.sin(a);
    const ty = -10 * (0.5 - 0.5 * Math.cos(a));
    c.el.style.transform = 'rotate(' + ang.toFixed(3) + 'deg) translateY(' + ty.toFixed(2) + 'px)';
  }

  // End glow pulse
  const g = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / 4);
  glowEl.style.transform = 'scale(' + (1 + 0.18 * g).toFixed(3) + ')';
  glowEl.style.opacity = (0.85 + 0.15 * g).toFixed(3);
};

window.__ready = function() {
  return document.fonts.status === 'loaded' &&
    Array.from(document.images).every(function(im) { return im.id === 'endclip' || (im.complete && im.naturalWidth > 0); }) &&
    CLIP_FRAMES.every(function(im) { return im.complete && im.naturalWidth > 0; });
};

window.__init = function() {
  computeLayout();
  window.__setTime(0);
};
</script>
</body>
</html>
