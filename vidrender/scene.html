<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPHD Vertical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

body {
  background: #1a0a05;
  background-image:
    radial-gradient(ellipse at 25% 12%, rgba(255,180,120,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 45%, rgba(200,140,80,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 85%, rgba(255,160,110,0.05) 0%, transparent 55%);
  font-family: 'Playfair Display', Georgia, serif;
  color: #fff;
  overflow-x: hidden;
}

/* ── Fixed atmosphere layers ── */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }

.cloud {
  position: absolute; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(255,245,238,0.13) 0%, transparent 70%);
  filter: blur(28px);
  animation: cloudDrift linear infinite;
}
@keyframes cloudDrift {
  0%   { transform: translateX(-40%); }
  100% { transform: translateX(160vw); }
}

.leaf {
  position: absolute; top: -30px;
  border-radius: 0 50% 50% 50%;
  transform: rotate(45deg);
  animation: leafFall linear infinite;
}
@keyframes leafFall {
  0%   { transform: translateY(-30px) rotate(45deg) translateX(0); opacity: 0; }
  8%   { opacity: var(--o); }
  88%  { opacity: var(--o); }
  100% { transform: translateY(132vh) rotate(405deg) translateX(70px); opacity: 0; }
}

.vignette {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 58%, rgba(10,4,2,0.55) 100%);
}

/* ── Hero ── */
.hero {
  height: 1280px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  position: relative; z-index: 1;
  padding: 0 48px;
}
.hero .rule {
  width: 90px; height: 1px;
  margin: 34px auto 0;
  background: linear-gradient(90deg, transparent, rgba(201,169,110,0.9), transparent);
}
.hero h1 {
  font-size: 84px; line-height: 1.14; font-weight: 700;
  background: linear-gradient(135deg, #e05a47 0%, #7fb3d9 55%, #c0392b 100%);
  background-size: 220% 220%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 5s ease-in-out infinite;
}
@keyframes shimmer {
  0%, 100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}
.hero h2 {
  margin-top: 26px;
  font-size: 44px; font-weight: 600;
  color: #c9a96e; letter-spacing: 0.22em;
}
.hero .date {
  margin-top: 30px;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 26px; letter-spacing: 0.35em;
  color: rgba(255,235,215,0.75);
}
.hero .years {
  margin-top: 14px;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
  font-size: 24px;
  color: rgba(255,215,190,0.6);
}

/* ── Polaroid flow ── */
.wall {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 90px;
  padding: 120px 0 260px;
}
.card {
  width: 470px;
  background: linear-gradient(175deg, #fdfaf5 0%, #f6efe6 100%);
  padding: 16px 16px 18px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.35);
  will-change: transform;
  animation: sway 7s ease-in-out infinite alternate;
}
.card:nth-child(odd)  { align-self: flex-start; margin-left: 46px; }
.card:nth-child(even) { align-self: flex-end; margin-right: 46px; }
.card img {
  display: block; width: 100%; aspect-ratio: 1 / 1;
  object-fit: cover;
  filter: saturate(1.04) contrast(1.02);
}
@keyframes sway {
  from { transform: rotate(var(--r)) translateY(0); }
  to   { transform: rotate(calc(var(--r) * -1)) translateY(-10px); }
}

.end-space {
  height: 520px;
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
}
.end-glow {
  width: 130px; height: 130px; border-radius: 50%;
  background: radial-gradient(circle at center, rgba(255,190,140,0.35) 0%, rgba(192,57,43,0.15) 45%, transparent 70%);
  animation: glowPulse 4s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50%      { transform: scale(1.18); opacity: 1; }
}
</style>
</head>
<body>

<div class="hero">
  <h1>Happy Anniversary<br>Mom &amp; Dad</h1>
  <div class="rule"></div>
  <h2>August 21, 2026</h2>
  <div class="date">EIGHTEEN YEARS</div>
  <div class="years">2008 &mdash; 2026</div>
</div>

<div class="wall" id="wall"></div>

<div class="end-space"><div class="end-glow"></div></div>

<div class="fx" id="fx"></div>
<div class="vignette"></div>

<script>
const PHOTOS = [
  "FB_IMG_1471918819858.jpg","IMG_0376.JPG","IMG_0495.JPG","IMG_0586.JPG",
  "IMG_1349.JPG","IMG_1982.JPG","IMG_2116.JPG","IMG_2831.JPG",
  "IMG_3044.JPG","IMG_3265.JPG","IMG_3475.jpg","IMG_4141.jpg",
  "IMG_4966.jpg","IMG_5279.jpg","IMG_7069.JPG","IMG_7151.JPG",
  "IMG-20240513-WA0001.jpg","IMG20210821214126.jpg"
];

// ── Polaroids ──
(function() {
  const wall = document.getElementById('wall');
  PHOTOS.forEach(function(name, i) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--r', ((i % 2 === 0 ? -1 : 1) * (1.2 + (i % 3) * 0.7)).toFixed(2) + 'deg');
    card.style.animationDelay = (-(i * 0.9)).toFixed(2) + 's';
    card.style.animationDuration = (6.5 + (i % 4) * 0.8).toFixed(1) + 's';
    const img = document.createElement('img');
    img.src = '../public/photos/' + encodeURIComponent(name);
    img.alt = '';
    img.draggable = false;
    card.appendChild(img);
    wall.appendChild(card);
  });
})();

// ── Clouds ──
(function() {
  const fx = document.getElementById('fx');
  for (let i = 0; i < 9; i++) {
    const el = document.createElement('div');
    el.className = 'cloud';
    const w = 220 + (i % 3) * 130;
    Object.assign(el.style, {
      top: (3 + i * 11) + '%',
      width: w + 'px',
      height: (w * 0.34) + 'px',
      opacity: String(0.05 + (i % 3) * 0.025),
      animationDelay: (-(i * 4)) + 's',
      animationDuration: (30 + (i % 3) * 14) + 's',
    });
    fx.appendChild(el);
  }
})();

// ── Leaves ──
(function() {
  const fx = document.getElementById('fx');
  const hues = [35, 28, 42, 20];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div');
    el.className = 'leaf';
    const size = 13 + (i % 4) * 6;
    const o = (0.28 + (i % 4) * 0.09).toFixed(2);
    el.style.setProperty('--o', o);
    Object.assign(el.style, {
      left: ((i * 3.9 + 1.4) % 96) + '%',
      width: size + 'px',
      height: Math.round(size * 1.3) + 'px',
      background: 'hsl(' + hues[i % 4] + ',52%,52%)',
      animationDelay: (-(i * 1.63) % 9).toFixed(2) + 's',
      animationDuration: (7 + (i % 5) * 1.6) + 's',
    });
    fx.appendChild(el);
  }
})();

// ── Slow auto-scroll timeline ──
// 0–5.5s hold on hero, then a continuous gentle glide to the end.
(function() {
  const HOLD = 5500;
  const TOTAL = 43000; // must match renderer duration
  const TAIL = 3500;   // ease-out settle at the bottom
  const start = performance.now();

  function maxScroll() {
    return document.documentElement.scrollHeight - window.innerHeight;
  }

  function tick() {
    const t = performance.now() - start;
    if (t > HOLD) {
      let p = Math.min(1, (t - HOLD) / (TOTAL - HOLD));
      // smoothstep ease-in-out so it starts and settles softly
      const e = p * p * (3 - 2 * p);
      window.scrollTo(0, e * maxScroll());
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
